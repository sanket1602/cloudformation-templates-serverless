AWSTemplateFormatVersion: '2010-09-09'
Description: "Your Description"
Parameters:
  LambdaFunctionName: 
    Type: String
    Description: Name of the Lambda Function to be created
    Default: <value>
  tagenvironment:
    Type: String
    Description: This is tagenvironment
    Default: <value>
  s3bucket:
    Type: String
    Description: Name of s3 bucket 
    Default: <value>
  reportingdatapath:
    Type: String
    Description: Name of reporting data path
    Default: <value>
  sourcecodebucketname:
    Type: String
    Description: sourcecodebucketname
    Default: <value>
  sourcecodebucketkey:
    Type: String
    Description: sourcecodebucketkey
    Default: <value>
Resources:
  MyRole: 
    Type: "AWS::IAM::Role"
    Properties: 
      AssumeRolePolicyDocument: 
        Version: "2012-10-17"
        Statement: 
          - 
            Effect: "Allow"
            Principal: 
              Service: 
                - "lambda.amazonaws.com"
            Action: 
              - "sts:AssumeRole"
      Path: "/"
      RoleName: !Join 
            - ''
            - - !Ref LambdaFunctionName
              - _LambdaRole
      Tags:
        - Key: Project
          Value: <value>
        - Key: Application
          Value: <value>          
        - Key: Name
          Value: !Join ## This joins the rolename into your resource name by using the !Join function
            - ''
            - - !Ref LambdaFunctionName
              - _LambdaRole
        - Key: Environment
          Value: !Ref tagenvironment
        - Key: Owner
          Value: <value>          
  MyRolePolicies: 
    Type: "AWS::IAM::Policy"
    DependsOn: MyRole
    Properties: 
      PolicyName: <value>
      PolicyDocument: 
        Version: "2012-10-17"
        Statement: 
         -  ##S3BucketAccess
            Sid: VisualEditor0
            Effect: Allow
            Action:
              - s3:ListMultipartUploadParts
              - s3:ListBucket
              - s3:HeadBucket
              - s3:GetObject
              - s3:GetBucketLocation
              - s3:GetObjectVersion
              - s3:PutObject
            Resource:
              - "*"
         - ##EC2 access
            Sid: VisualEditor1      
            Effect: Allow
            Action: 
              - ec2:DescribeNetworkInterfaces
              - ec2:CreateNetworkInterface
              - ec2:DeleteNetworkInterface
              - ec2:DescribeInstances
              - ec2:AttachNetworkInterface
            Resource: "*"
         - ##DyanmoDB Access
            Sid: VisualEditor2
            Action:
              - dynamodb:PutItem
              - dynamodb:BatchWriteItem
              - dynamodb:UpdateItem
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:Scan
              - dynamodb:ConditionCheckItem
              - dynamodb:Query
              - dynamodb:DescribeGlobalTableSettings
              - dynamodb:DescribeGlobalTable
            Effect: Allow
            Resource:
              - "*"
         - ##DyanmoDB Stream Access
            Sid: VisualEditor3
            Effect: Allow
            Action:
              - dynamodb:GetRecords
              - dynamodb:GetShardIterator
              - dynamodb:DescribeStream
              - dynamodb:ListStreams
            Resource:
              - "*"
            Sid: VisualEditor4         
            Action: cloudwatch:*
            Effect: Allow
            Resource: "*"
         -  ## CloudWatch Logs access
            Sid: VisualEditor5
            Effect: Allow
            Action:
              - logs:List*
              - cloudwatch:List*
              - logs:List*
              - logs:GetLogRecord
              - logs:DescribeLogStreams
              - logs:DescribeSubscriptionFilters
              - logs:StartQuery
              - logs:DescribeMetricFilters
              - logs:GetLogDelivery
              - logs:CreateLogStream
              - logs:TagLogGroup
              - logs:GetLogEvents
              - logs:FilterLogEvents
              - logs:DescribeResourcePolicies
              - logs:DescribeDestinations
              - logs:DescribeQueries
              - logs:UntagLogGroup
              - logs:DescribeLogGroups
              - logs:StopQuery
              - logs:TestMetricFilter
              - logs:PutLogEvents
              - logs:CreateLogGroup
              - logs:DescribeExportTasks
              - logs:GetQueryResults
              - logs:PutRetentionPolicy
              - logs:GetLogGroupFields
            Resource: "*" 
      Roles: 
        - 
          Ref: "MyRole"
  MyLambda:
    Type: AWS::Lambda::Function
    DependsOn: MyRolePolicies
    DeletionPolicy: Retain    
    Properties:
      Environment:
        Variables:
          bucket_name: !Ref s3bucket
          reporting_data_path: !Ref reportingdatapath 
      FunctionName: !Ref LambdaFunctionName
      Handler: lambda_function.lambda_handler
      Runtime: python3.8
      Role: {"Fn::GetAtt" : ["MyRole", "Arn"] }       
      Description: ''
      MemorySize: 128
      Timeout: 900
      Code: 
        S3Bucket: !Ref sourcecodebucketname
        S3Key: !Ref sourcecodebucketkey
      Tags:
        - Key: Project
          Value: <value>
        - Key: Application
          Value: <value>          
        - Key: Name
          Value: !Ref LambdaFunctionName
        - Key: Environment
          Value: !Ref tagenvironment
        - Key: Owner
          Value: <value>
        - Key: Describe
          Value: <value>
  LambdaFunctionLogGroup:
    Type: "AWS::Logs::LogGroup"
    DependsOn: "MyLambda"
    Properties:
      RetentionInDays: 7
      LogGroupName: !Join ["", ["/aws/lambda/", !Ref LambdaFunctionName]]
