AWSTemplateFormatVersion: '2010-09-09'
Description: A template to update ECS cloudwatch events.
Parameters:
  ClusterARN:
    Type: String
    Description: ARN of cluster
    Default: <your-cluster-arn>
  TaskDefintionName:
    Type: String
    Description: Name of Task Definition
    Default: <your-task-definition-name>
  TaskDefintionARN:
    Type: String
    Description: ARN of Task Definition
    Default: <your-task-definition-ARN>
  SecurityGroup:
    Type: String
    Description: SecurityGroup for Task
    Default: <your-sg-id>
  Subnets:
    Type: String
    Description: Subnets of task 
    Default: <your-subnet>
  EventName:
    Type: String
    Description: <your description>
    Default: <your-event-rule-name>
  tagenvironment:
    Type: String
    Description: Environment name, eg PreProd,Production
    Default: <value>
  OwnerTag:
    Description: Name Of the Project Owner
    Type: String
    Default: <value>
  ProjectTag:
    Description: Name Of the project
    Type: String
    Default: <value>
  ApplicationTag:
    Description: Name Of the project
    Type: String
    Default: <value>   
  EnvTag:
    Description: Environment of the resource
    Type: String
    Default: <value>  
Resources:
  EventRule:
    Type: AWS::Events::Rule
    Properties: 
      Description: <your-description>
      ScheduleExpression: 'cron(* * * * *)'
      Name: !Ref EventName
      State: ENABLED
      Targets: 
        - Id:  !Ref TaskDefintionName
          RoleArn: 
            'Fn::GetAtt':
              - ExecutionRole
              - Arn
          EcsParameters:
            TaskDefinitionArn: !Ref TaskDefintionARN
            LaunchType: 'FARGATE'
            NetworkConfiguration:
              AwsVpcConfiguration:
                AssignPublicIp: DISABLED
                SecurityGroups:
                  - !Ref SecurityGroup
                Subnets:
                  - !Ref Subnets
          Arn: !Ref ClusterARN
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: <your-iam-role-name>
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: 'sts:AssumeRole'
      Path: "/"
      Tags:
        - Key: Project
          Value: InstaGO
        - Key: Name
          Value: !Join
            - ''
            - - !Ref TaskDefintionName
              - _Role
        - Key: Owner
          Value: !Ref 'OwnerTag'
        - Key: Project
          Value: !Ref 'ProjectTag'
        - Key: Application
          Value: !Ref 'ApplicationTag'
        - Key: Environment
          Value: !Ref 'EnvTag'
        - Key: !Ref 'ProjectTag'
          Value: " "
        - Key: !Ref 'EnvTag'
          Value: " "
      Policies:
      - PolicyName: <your-iam-policy-name>
        PolicyDocument:
          Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action:
                - 'ecs:RunTask' 
              Resource: '*'
              Condition:
                ArnLike: 
                  'ecs:cluster': !Ref ClusterARN
            - Effect: Allow
              Action: 'iam:PassRole'
              Resource:
                - '*'
              Condition:
                StringLike:
                  'iam:PassedToService': ecs-tasks.amazonaws.com
